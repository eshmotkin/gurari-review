<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Gurari manuscripts · Round two review</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1c1b19;--mut:#5b5852;--line:#e4e1da;--acc:#2f5d50;--new:#2f5d50;--same:#6b6f78;--dup:#8a5a2b;--uns:#b4541a;--blank:#8f8a80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(246,245,242,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:20px 0 12px}
h1{font-size:24px;margin:0;letter-spacing:-.01em}.eyebrow{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.counter{display:flex;align-items:stretch;gap:8px;padding:0 0 16px;flex-wrap:wrap}
.stat{flex:1 1 0;min-width:110px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-align:left;cursor:pointer;font:inherit;color:inherit;transition:.15s;position:relative}
.stat:hover{border-color:#bdb8ad;transform:translateY(-1px)}.stat:focus-visible{outline:3px solid #9cc3b6;outline-offset:2px}
.stat .n{font-size:24px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}.stat .l{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px}
.stat .l i{width:8px;height:8px;border-radius:50%;display:inline-block}
.stat.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.stat.total{background:var(--ink);color:#fff;border-color:var(--ink)}.stat.total .l{color:#d6d3cc}.stat.total.on{box-shadow:0 0 0 3px #9cc3b6}
.op{align-self:center;color:var(--mut);font-size:20px;font-weight:300}
.stat.na{cursor:default;border-style:dashed}.stat.na:hover{transform:none}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:0 0 14px;background:var(--line)}
main{padding:28px 0 64px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px}.sec-h h2{font-size:20px;margin:0}
.sub{color:var(--mut);margin:0 0 20px;max-width:720px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:.15s}
.card:hover{box-shadow:0 6px 24px rgba(0,0,0,.07)}
.ph{display:block;width:100%;aspect-ratio:4/3;background:#ecebe6;border:0;padding:0;cursor:zoom-in;position:relative;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .25s}.ph:hover img{transform:scale(1.03)}
.ph:focus-visible{outline:3px solid #9cc3b6;outline-offset:-3px}
.meta{padding:12px 16px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fn{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}.tag{font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px;white-space:nowrap}
.t-new{background:#e3eee9;color:var(--new)}.t-same{background:#ecedf0;color:#474b53}.t-dup{background:#f4eadf;color:var(--dup)}.t-uns{background:#fbe9dc;color:var(--uns)}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1px;background:var(--line)}
.side{background:var(--card);display:flex;flex-direction:column;min-width:0;width:100%}.side .ph{width:100%;flex:none;position:relative}.side .ph img{position:absolute;inset:0;width:100%;height:100%}
.cap{padding:8px 14px;font-size:13px;color:var(--mut);border-top:1px solid var(--line)}.cap b{display:block;color:var(--ink);font-size:14px}
.q{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:28px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.qcard .ph{aspect-ratio:auto;height:380px}@media(max-width:600px){.qcard .ph{height:240px}}
.qfoot{padding:16px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;border-top:1px solid var(--line)}.qfoot .btns{display:flex;justify-content:center;gap:12px}.qfoot p{margin-left:auto!important;margin-right:auto!important}
.qfoot h3{margin:0;font-size:18px}.qfoot p{margin:2px 0 0;color:var(--mut);font-size:14px;max-width:560px}
.btns{display:flex;gap:10px}.btn{font:600 15px/1 inherit;font-family:inherit;padding:12px 26px;border-radius:10px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;min-width:120px;transition:.12s}
.btn:hover{background:#f1efe9}.btn:focus-visible{outline:3px solid #9cc3b6;outline-offset:2px}.btn.sel{background:var(--ink);color:#fff}
.ans{font-size:14px;color:var(--acc);font-weight:600}
.ph.missing{cursor:default;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--mut);font-size:14px;background:repeating-linear-gradient(45deg,#f1efea,#f1efea 10px,#ebe9e3 10px,#ebe9e3 20px)}
.note{background:#fff8ef;border:1px solid #f0dcc2;border-radius:12px;padding:12px 16px;color:#6d4a20;font-size:14px;margin:0 0 20px}
.empty{padding:40px;text-align:center;color:var(--mut)}
/* viewer */
#v{position:fixed;inset:0;background:#12110f;z-index:50;display:none;flex-direction:column}#v.open{display:flex}
#v .vb{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;color:#eee;font-size:15px}
#v .stage{flex:1;display:flex;gap:16px;padding:0 72px 24px;min-height:0}
#v .pane{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#v .pane .lbl{color:#cfcac0;font-size:14px;padding:0 0 8px}#v .pane .lbl b{color:#fff}
#v .vp{flex:1;overflow:hidden;border-radius:8px;background:#000;display:flex;align-items:center;justify-content:center;cursor:zoom-in;min-height:0}
#v .vp img{max-width:100%;max-height:100%;transition:transform .15s;transform-origin:center}
#v .vp.z{cursor:grab;overflow:auto;display:block;touch-action:none;overscroll-behavior:contain}#v .vp.z.drag{cursor:grabbing}#v .vp.z img{user-select:none;-webkit-user-drag:none}#v .vp.z img{max-width:none;max-height:none;width:220%}
.vbtn{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:99px;width:44px;height:44px;font-size:22px;cursor:pointer}.vbtn:hover{background:rgba(255,255,255,.24)}
.nav{position:absolute;top:50%;transform:translateY(-50%)}.nav.l{left:14px}.nav.r{right:14px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.wrap{padding:0 16px}h1{font-size:20px}.top{padding:14px 0 8px}.grid{grid-template-columns:1fr}
 .counter{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.op{display:none}.stat{min-width:0;padding:8px 10px}.stat .n{font-size:20px}.stat .l{font-size:12px}.stat.total{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
 .qfoot{flex-direction:column;align-items:center}.qfoot .btns{width:100%}.btn{flex:1}#v .stage{flex-direction:column;padding:0 12px 12px}.nav{display:none}}
.cm{padding:4px 14px 10px;font-size:13px}.cm summary{cursor:pointer;color:var(--mut);list-style:none;display:inline-flex;gap:6px;align-items:center;padding:4px 0}.cm summary::-webkit-details-marker{display:none}.cm summary:hover{color:var(--ink)}
.cm textarea{width:100%;min-height:64px;font:14px/1.4 inherit;font-family:inherit;border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0;resize:vertical}.cm .send{font:600 13px inherit;font-family:inherit;padding:6px 14px;border-radius:8px;border:0;background:var(--ink);color:#fff;cursor:pointer}
.cm ul{list-style:none;margin:6px 0 0;padding:0}.cm li{background:#f6f5f2;border-radius:8px;padding:6px 10px;margin-top:6px;color:var(--ink)}.cm li time{display:block;color:var(--mut);font-size:12px}
#v .cm{color:#ddd;padding:6px 0 0}#v .cm summary{color:#bbb}#v .cm li{background:#2a2825;color:#eee}#v .cm textarea{background:#1e1d1b;color:#eee;border-color:#444}#v .cm .send{background:#fff;color:#111}
.total-line{display:flex;align-items:baseline;gap:10px;padding:0 0 10px}.total-line .n{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}.total-line .l{font-size:15px;color:var(--mut)}
.minor{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mut);padding:0 0 12px}.minor button{font:inherit;color:inherit;background:none;border:0;padding:4px 0;cursor:pointer;text-decoration:underline}.minor button.on{color:var(--ink);font-weight:600}
.warn{background:#fdecea;border:1px solid #e9b4ad;color:#8a1c12;border-radius:10px;padding:8px 12px;font-size:14px;margin:0 0 10px}
.pair.one{grid-template-columns:minmax(0,1fr)}.cmst{display:block;font-size:12px;color:var(--mut)}
main{padding:20px 0 48px}.sub{margin:0 0 14px}

et, same text); lower confidence.", "time": "2026:09:09 14:53:36"}, {"file": "204A6930.jpg", "img": "img/0c9897c03cbe.jpg?v=4", "cand": "r1img/85e351eeff4d.jpg?v=4", "cname": "A2 Shoot 4 / 204A2169.jpg (MS p.18)", "note": "Handwritten series §2 continued (B 6927–6931): page numbers and text aligned with the numbered fair copy in A2 Shoot 4 (204A2152 = p.1 … 204A2175 = p.24). Numbered -18-, same as round one: “is negative. Since ⟨0|H″|0⟩ = ⟨w|H″|w⟩ = 0, it follows…”, then Fröhlich’s problem (eq. 2.32–2.34) = round-one pp.18–19. Rewrite (different sheet, same text), heavily corrected draft.", "time": "2026:09:09 14:53:44"}, {"file": "204A6931.jpg", "img": "img/cab1552231fe.jpg?v=4", "cand": "r1img/f6075ae794ed.jpg?v=4", "cname": "A2 Shoot 4 / 204A2171.jpg (MS p.20)", "note": "Handwritten series §2 continued (B 6927–6931): page numbers and text aligned with the numbered fair copy in A2 Shoot 4 (204A2152 = p.1 … 204A2175 = p.24). Unnumbered: “We state now a theorem which may be useful for lower limits… The proof is purely mathematical” = round-one p.20 (“The proof, which is simple but purely mathematical…”). Rewrite (different sheet, same text).", "time": "2026:09:09 14:53:54"}, {"file": "204A6937.jpg", "img": "img/dd88517442c4.jpg?v=5", "time": "2026:09:09 14:56:05", "pages": 1, "cand": "img/2c5134fa27d6.jpg?v=5", "cname": "A2/Shoot 2 - All Photos (Best Quality) / London_Documents-546.jpg", "pts": 49, "note": "Best round-1 detail match 49 points (below the 100-point 'Same' bar). "}, {"file": "204A6942.jpg", "img": "img/367cb674c395.jpg?v=5", "time": "2026:09:09 14:57:34", "pages": 1, "cand": "img/b147c58fac00.jpg?v=5", "cname": "A2/Shoot 4 - All Photos (Best Quality) / 204A2307.jpg", "pts": 50, "note": "Best round-1 detail match 50 points (below the 100-point 'Same' bar). "}, {"file": "204A6944.jpg", "img": "img/3b33b4ea4414.jpg?v=5", "time": "2026:09:09 14:57:55", "pages": 1, "cand": "img/a72627c5b895.jpg?v=5", "cname": "A2/Shoot 4 - All Photos (Best Quality) / 204A23 const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let _pk;const pk=()=>_pk||(_pk=crypto.subtle.importKey('spki',unb64(RELAY.pub),{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']));
async function seal(o){const k=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt']);const iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(o)));const ek=await crypto.subtle.encrypt({name:'RSA-OAEP'},await pk(),await crypto.subtle.exportKey('raw',k));
 return JSON.stringify({v:2,ek:b64(ek),iv:b64(iv),ct:b64(ct)})}
const Q=JSON.parse(localStorage.gurariQ||'{}');const saveQ=()=>localStorage.gurariQ=JSON.stringify(Q);const BK=[2e3,1e4,3e4,12e4,6e5];
async function sendOne(id){const it=Q[id];if(!it||it.status=='sent'||it.busy)return;it.busy=1;it.attempt=(it.attempt||0)+1;it.payload.client={user_agent:navigator.userAgent,attempt:it.attempt};
 const c=new AbortController();const t=setTimeout(()=>c.abort(),1e4);let st=0;
 try{const r=await fetch('https://ntfy.sh/'+RELAY.topic,{method:'POST',body:await seal(it.payload),signal:c.signal});st=r.status}catch(e){st=0}clearTimeout(t);delete it.busy;
 if(st>=200&&st<300)it.status='sent';else if(st==0||st==429||st>=500){it.status='queued';it.next=Date.now()+BK[Math.min(it.attempt-1,4)]}else{it.status='failed';it.err=st}
 saveQ();paintSt(id)}
function flush(force){Object.keys(Q).forEach(id=>{const it=Q[id];delete it.busy;if(it.status=='queued'&&(force||!it.next||it.next<=Date.now()))sendOne(id);else if(force&&it.status=='failed')sendOne(id)})}
setInterval(()=>flush(false),2e3);addEventListener('online',()=>flush(true));
function enqueue(id,p){Q[id]={payload:p,status:'queued',attempt:0};saveQ();sendOne(id)}
function stTxt(id){const it=Q[id];if(!it)return 'Saved on this device only';if(it.status=='sent')return 'Sent ✓';if(it.status=='failed')return `Not sent (error ${it.err}). <button class="rt">Retry</button>`;
 return it.attempt>1||it.next?`Not sent, will retry · <button class="rt">Retry now</button>`:'Sending…'}
function paintSt(id){document.querySelectorAll(`.cmst[data-id="${id}"]`).forEach(e=>{e.innerHTML=stTxt(id);e.querySelectorAll('.rt').forEach(b=>b.onclick=()=>sendOne(id))})}
function cm(f,cat){const L=cms[f]||[];return `<details class="cm" data-f="${esc(f)}" data-c="${cat}"><summary>💬 Comment or question${L.length?` · ${L.length}`:''}</summary><textarea maxlength="2000" aria-label="Comment or question about ${esc(f)}" placeholder="Write a comment or question"></textarea><button class="send">Send</button><ul>${L.map(c=>`<li>${esc(c.text)}<time>${new Date(c.ts).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</time><span class="cmst" aria-live="polite" data-id="${c.id||''}">${stTxt(c.id)}</span></li>`).join('')}</ul></details>`}
function ctxFor(f){const s=D.unsure.find(x=>x.file==f||x.cname==f);if(s)return ['unsure',[{role:'round2',file:s.file,url:abs(s.img)},...(s.cand?[{role:'round1_candidate',file:s.cname,url:abs(s.cand)}]:[])],s.file,'uns'];
 const m=D.same.find(x=>x.file==f||x.cname==f);if(m)return ['same',[{role:'round2',file:m.file,url:abs(m.img)},{role:'round1',file:m.cname,url:abs(m.cand)}],m.file,'same'];
 const d=D.dups.find(x=>x.file==f||x.keep==f);if(d)return ['dup',[{role:'kept_copy',file:d.keep,url:abs(d.img)}],d.file,'dup'];
 const n=D.new.find(x=>x.file==f);return ['new',[{role:'round2',file:f,url:n?abs(n.img):null}],f,'new']}
function bindCm(root){root.querySelectorAll('.cm .send').forEach(b=>b.onclick=()=>{const d=b.closest('.cm'),t=d.querySelector('textarea'),v=t.value.trim();if(!v||v.length>2000)return;const f=d.dataset.f;
 const id='c_'+crypto.randomUUID();const [cat,imgs,key,vw]=ctxFor(f);const now=new Date();
 (cms[f]=cms[f]||[]).push({id,text:v,ts:now.getTime()});localStorage.gurariCm=JSON.stringify(cms);
 const p={schema:'gurari.comment.v1',comment_id:id,project:'Mark Gurari Project',image_id:f,images:imgs,category:cat,context:d.closest('#v')?'viewer':(d.closest('.qcard')?'pair_card':'card'),answer:ans[key]||null,text:v,created_at:now.toISOString(),page_url:BASE+'#'+vw,deep_link:BASE+'#'+vw+'&img='+encodeURIComponent(key)};
 const w=document.createElement('div');Q[id]={payload:p,status:'queued',attempt:0};saveQ();w.innerHTML=cm(f,d.dataset.c);const n=w.firstChild;n.open=true;d.replaceWith(n);bindCm(n.parentElement);sendOne(id)});
 root.querySelectorAll('.cmst[data-id]').forEach(e=>{const id=e.dataset.id;if(id)e.querySelectorAll('.rt').forEach(b=>b.onclick=()=>sendOne(id))})}
function ph(src,alt,idx,side){return src?`<button class="ph" data-i="${idx}" data-s="${side||0}" aria-label="Enlarge ${esc(alt)}"><img ${side!==undefined&&side!==0||view=='uns'?'':'loading="lazy" '}src="${esc(src)}" alt="${esc(alt)}"></button>`:`<div class="ph missing">Round-1 match not available<br>in the review data</div>`}
function single(it,tag,cls,i){return `<article class="card">${ph(it.img,it.file,i)}<div class="meta"><span class="fn">${esc(it.file)}${D.ser[it.file]?`<br><small style="color:var(--mut);font-weight:400">${esc(D.ser[it.file])}</small>`:""}</span><span class="tag ${cls}">${tag}</span></div>${cm(it.file,tag)}</article>`}
function pairCard(a,b,i,cls,tag){return `<article class="card"><div class="pair"><div class="side">${ph(a.src,a.t,i,0)}<div class="cap"><b>${esc(a.t)}</b>${a.s}</div>${cm(a.t,tag)}</div><div class="side">${ph(b.src,b.t,i,1)}<div class="cap"><b>${esc(b.t)}</b>${b.s}</div>${cm(b.t,tag)}</div></div><div class="meta"><span class="fn">${esc(a.t)}${D.ser[a.t]?`<br><small style="color:var(--mut);font-weight:400">${esc(D.ser[a.t])}</small>`:""}</span><span class="tag ${cls}">${tag}</span></div></article>`}
const secs={
 new:()=>{const NL=[...D.new,...D.unsure.filter(x=>ans[x.file]=='Different').map(x=>({file:x.file,img:x.img}))];LIST=NL.map(x=>[{src:x.img,t:x.file,s:'Round 2 · new'}]);return head('New in round 2',C.new+' photos','Round-2 photos with no match anywhere in round 1. A photo can show more than one page, so this counts photos, not pages.')+`<div class="grid">${NL.map((x,i)=>single(x,'New','t-new',i)).join('')}</div>`},

  <div class="qfoot"><div><h3>${x.cand?'Same page or different?':'New, or already in round 1?'}</h3><p>${i+1} of ${D.unsure.length}${a?` · <span class="ans">You said ${a=='Same'&&!x.cand?'Seen in round 1':a=='Different'&&!x.cand?'New':a}</span>${ansT[x.file]?` · <span class="ans">Saved ${tfmt(ansT[x.file])}</span>`:''}`:''}</p></div><div class="btns"><button class="btn ${a=='Same'?'sel':''}" data-a="Same" data-f="${x.file}">${x.cand?'Same':'Seen in round 1'}</button><button class="btn ${a=='Different'?'sel':''}" data-a="Different" data-f="${x.file}">${x.cand?'Different':'New'}</button></div></div></li>`}).join('')}</ol>`},
 same:()=>{const SL=[...D.same,...D.unsure.filter(x=>ans[x.file]=='Same'&&x.cand)];LIST=SL.map(x=>[{src:x.img,t:x.file,s:'Round 2'},{src:x.cand,t:x.cname,s:'Round 1'}]);return head('Same as round 1',C.same,'Round-2 photos matched to a page already photographed in round 1.')+`<div class="grid">${SL.map((x,i)=>pairCard({src:x.img,t:x.file,s:'Round 2'},{src:x.cand,t:x.cname,s:'Round 1'},i,'t-same','Same')).join('')}</div>`},
 dup:()=>{LIST=D.dups.map(x=>[{src:x.img,t:x.keep,s:'Kept copy'}]);return head('Within round 2',C.dup,'Repeat photos: round 2 photographed the same sheet more than once. Only one photo is kept.')+`<div class="grid">${D.dups.map((x,i)=>`<article class="card">${ph(x.img,x.keep,i)}<div class="meta"><span class="fn">${esc(x.file)} <span style="color:var(--mut);font-weight:400">= ${esc(x.keep)}</span></span><span class="tag t-dup">Within round 2</span></div>${cm(x.file,'Duplicate')}</article>`).join('')}</div>`},
};

function panZoom(p){const img=p.querySelector('img');if(!img)return;let drag=null,moved=false,pinch=null,pts=new Map(),W=220;
 const setW=(w,cx,cy)=>{const r=p.getBoundingClientRect();const fx=(p.scrollLeft+cx)/p.scrollWidth,fy=(p.scrollTop+cy)/p.scrollHeight;W=Math.max(100,Math.min(600,w));img.style.width=W+'%';p.scrollLeft=fx*p.scrollWidth-cx;p.scrollTop=fy*p.scrollHeight-cy};
 const zoomOn=(cx,cy)=>{p.classList.add('z');W=220;img.style.width='220%';const r=p.getBoundingClientRect();p.scrollLeft=(cx/r.width)*p.scrollWidth-cx;p.scrollTop=(cy/r.height)*p.scrollHeight-cy};
 const zoomOff=()=>{p.classList.remove('z');img.style.width=''};
 p.addEventListener('pointerdown',e=>{pts.set(e.pointerId,[e.clientX,e.clientY]);moved=false;
  if(pts.size==2&&p.classList.contains('z')){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),w:W};drag=null;return}
  if(p.classList.contains('z')){drag={x:e.clientX,y:e.clientY,l:p.scrollLeft,t:p.scrollTop};p.setPointerCapture(e.pointerId);p.classList.add('drag')}});
 p.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pinch&&pts.size==2){const [a,b]=[...pts.values()];const r=p.getBoundingClientRect();setW(pinch.w*Math.hypot(a[0]-b[0],a[1]-b[1])/pinch.d,(a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top);moved=true;e.preventDefault();return}
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;p.scrollLeft=drag.l-dx;p.scrollTop=drag.t-dy;e.preventDefault()}});
 const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size){drag=null;p.classList.remove('drag')}};
 p.addEventListener('pointerup',up);p.addEventListener('pointercancel',up);
 p.addEventListener('wheel',e=>{if(!p.classList.contains('z'))return;if(e.ctrlKey){e.preventDefault();const r=p.getBoundingClientRect();setW(W*(e.deltaY<0?1.1:0.9),e.clientX-r.left,e.clientY-r.top)}},{passive:false});
 p.addEventListener('click',e=>{if(moved){moved=false;return}const r=p.getBoundingClientRect();p.classList.contains('z')?zoomOff():zoomOn(e.clientX-r.left,e.clientY-r.top)});}
let cur=0;function open(i){cur=i;const it=LIST[i];if(!it)return;vt.textContent=`${it.map(x=>x.t).join('  vs  ')}   ·   ${i+1} / ${LIST.length}`;
 vs.innerHTML=it.map(x=>`<div class="pane">${it.length>1?`<div class="lbl"><b>${esc(x.s)}</b> · ${esc(x.t)}</div>`:''}<div class="vp">${x.src?`<img src="${esc(x.src)}" alt="">`:'<span style="color:#aaa">Not available</span>'}</div>${x.src?cm(x.t,'Viewer'):''}</div>`).join('');bindCm(vs);
