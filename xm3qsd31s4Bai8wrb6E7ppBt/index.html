<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#2b2622;--mute:#7a7068;--line:#e4ddd3;--new:#b5452f;--seen:#3f7a52;--open:#b8860b;--oc:#5b5f9e;--acc:#6b4f3a}

header{position:sticky;top:0;z-index:5;background:rgba(246,243,238,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:6px 10px}
h1{font:600 15px/1.2 Georgia,serif;margin:0 0 5px;color:var(--acc)}
.bar{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 9px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip b{font-size:14px;margin-left:3px}.chip.on{outline:2px solid var(--ink)}
.k-New b{color:var(--new)}.k-Matched b{color:var(--seen)}.k-Open b{color:var(--open)}.k-Other b{color:var(--oc)}.k-Ask b{color:var(--acc)}
.side{margin-left:auto;font-size:11.5px;color:var(--mute);cursor:pointer;text-decoration:underline dotted}
#sync{font-size:11px;color:var(--mute);margin-top:3px}
main{padding:8px;display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ch{display:flex;gap:6px;align-items:center;padding:5px 7px;font-size:12.5px}
.ch .f{font-weight:600}.ch .m{color:var(--mute);font-size:11.5px;margin-left:auto;white-space:nowrap}.ch a{color:var(--mute)}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:#fff;border-radius:3px;padding:1px 5px;white-space:nowrap}
.New{background:var(--new)}.Matched,.Seen{background:var(--seen)}.Open,.Review{background:var(--open)}.Other{background:var(--oc)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--line)}
.pair.solo{grid-template-columns:1fr}
.ph{position:relative;background:#eee8df;height:160px;display:flex;align-items:center;justify-content:center;cursor:zoom-in;overflow:hidden}
.ph img,.ph canvas{max-width:100%;max-height:100%;display:block}
.ph .lab{position:absolute;left:3px;top:3px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:1px 4px;border-radius:3px}
.iw{position:relative;max-width:100%;max-height:100%}
.box{position:absolute;border:2px solid;pointer-events:none}.box span{position:absolute;left:0;top:0;font-size:10px;color:#fff;padding:0 3px}
.b0{border-color:#e0533c}.b0 span{background:#e0533c}.b1{border-color:#2f7fd0}.b1 span{background:#2f7fd0}.b2{border-color:#2a9d5c}.b2 span{background:#2a9d5c}
.reg{border-top:1px solid var(--line);padding:5px 7px;font-size:12px}
.rh{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.note{color:var(--mute);font-size:11.5px;margin-top:3px}
.btns{display:flex;gap:5px;margin-top:5px;align-items:center}
.btns button{flex:1;border:1px solid var(--line);background:#faf8f5;border-radius:5px;padding:7px 0;font-size:13px;font-weight:600;cursor:pointer}
.btns button.on.s{background:var(--seen);color:#fff;border-color:var(--seen)}.btns button.on.d{background:var(--new);color:#fff;border-color:var(--new)}
.btns .st{font-size:10.5px;color:var(--mute);min-width:54px;text-align:right}
.q{background:#fff8e6;border:1px solid #ecd9a6;border-radius:8px;padding:7px;grid-column:1/-1;font-size:13px}
#lb{display:none;position:fixed;inset:0;background:#111;z-index:9;touch-action:none}#lbi{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none}
#lbbar{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);color:#ddd;font-size:12px;padding:8px 10px}#lbbar a{color:#fff}
.lbb{position:absolute;top:8px;background:rgba(0,0,0,.5);color:#fff;border:0;font-size:22px;width:40px;height:40px;border-radius:20px;cursor:pointer}
#dl{display:none;grid-column:1/-1;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px;font-size:12px;color:var(--mute)}
@media(min-width:700px){.ph{height:230px}}
</style></head><body>
