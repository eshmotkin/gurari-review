<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#2b2722;--mute:#7a7065;--line:#e2dacb;--new:#2f6b45;--newbg:#e3efe5;--rev:#8a5a12;--revbg:#f6ead2;--seen:#3d5a7a;--seenbg:#e2e9f1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Georgia,"Iowan Old Style","Palatino Linotype",serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:22px 28px 14px;position:sticky;top:0;z-index:5}
.eyebrow{font:600 11px/1 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
h1{font-weight:normal;font-size:26px;margin:6px 0 4px}.sub{color:var(--mute);font-size:14px;margin:0 0 12px;max-width:900px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{font:600 13px system-ui,sans-serif;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}.tab b{font-weight:700;margin-left:4px}
main{max-width:1280px;margin:0 auto;padding:24px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:26px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.ch{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}.ch h2{font-weight:normal;font-size:20px;margin:0}
.meta{font:13px system-ui,sans-serif;color:var(--mute)}.meta a{color:var(--seen)}
.badge{font:700 11px/1 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:4px}
.New{background:var(--newbg);color:var(--new)}.Review{background:var(--revbg);color:var(--rev)}.Seen{background:var(--seenbg);color:var(--seen)}.Blank{background:#ece9e3;color:#6b655c}
.wrap{position:relative;display:inline-block;max-width:100%;cursor:zoom-in}.wrap img{display:block;max-width:100%;max-height:78vh;border-radius:4px}
.box{position:absolute;border:3px solid;border-radius:3px;pointer-events:none}.box span{position:absolute;left:-3px;top:-3px;font:700 12px system-ui,sans-serif;color:#fff;padding:3px 7px;border-radius:3px 0 3px 0}
.c0{border-color:#b5452f}.c0 span{background:#b5452f}.c1{border-color:#2f5fa0}.c1 span{background:#2f5fa0}.c2{border-color:#3d7a3d}.c2 span{background:#3d7a3d}
.regs{margin-top:18px;display:grid;gap:14px}.reg{border-top:1px solid var(--line);padding-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.reg h3{grid-column:1/-1;margin:0;font:600 14px system-ui,sans-serif;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.reg figure{margin:0}.reg img{width:100%;max-height:60vh;object-fit:contain;background:#ece6da;border-radius:4px;cursor:zoom-in}
figcaption{font:12.5px/1.4 system-ui,sans-serif;color:var(--mute);margin-top:6px;word-break:break-word}figcaption a{color:var(--seen)}
.none{display:flex;align-items:center;justify-content:center;min-height:160px;background:#f0ece3;border:1px dashed var(--line);border-radius:4px;color:var(--mute);font:14px system-ui,sans-serif;text-align:center;padding:12px}
.note{grid-column:1/-1;font:13px system-ui,sans-serif;color:var(--ink);background:#f7f3ea;border-left:3px solid var(--line);padding:6px 10px}
#lb{display:none;position:fixed;inset:0;background:#141210;z-index:20;touch-action:none;overflow:hidden}#lbi{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none}
#lbbar{position:absolute;left:0;right:0;bottom:0;color:#eee;background:rgba(20,18,16,.85);padding:10px 14px;font:13px system-ui,sans-serif;z-index:2}#lbbar a{color:#9cc3ff}
.nb{position:absolute;z-index:3;background:rgba(255,255,255,.14);color:#fff;border:0;font-size:26px;width:48px;height:48px;border-radius:50%;cursor:pointer}
@media(max-width:700px){header{padding:14px 14px 10px;position:static}h1{font-size:21px}main{padding:12px 10px 40px}.card{padding:14px}.reg{grid-template-columns:1fr}}
</style></head><body>
